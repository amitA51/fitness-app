[build]
  # build:release = vite build + scripts/strip-sourcemaps.mjs. The build emits
  # hidden source maps (for Sentry de-minification) and the script moves them out
  # of dist/ so they are never served from the CDN.
  command = "npm run build:release"
  publish = "dist"
  # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be set in the Netlify dashboard
  # (Site settings -> Environment variables). Do not commit secrets here.

[build.environment]
  # Pin the Node version so a Netlify default bump cannot silently change the
  # build toolchain under a security-sensitive config.
  NODE_VERSION = "22"

# A missing hashed asset must 404. Before this rule, the SPA catch-all below
# answered /assets/*.js with index.html + HTTP 200, and the service worker's
# CacheFirst rule then cached that HTML under the chunk URL for 30 days — every
# tab open across a deploy broke with "Failed to fetch dynamically imported
# module" instead of recovering via the update flow.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://world.openfoodfacts.org; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera=(self): BarcodeScanner uses getUserMedia — an empty allowlist
    # disabled it for ALL origins, silently forcing every scan to manual entry.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Hashed assets are content-addressed: cache them forever at the CDN edge.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
